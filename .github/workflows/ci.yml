name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every service test mocks PrismaService directly (grep confirms zero `new PrismaClient()` in any
# *.spec.ts) and no *.spec.ts imports main.ts (which would try to actually boot the app) — so
# neither job needs a real Postgres/Redis to run. DATABASE_URL still has to be a syntactically
# valid connection string for `prisma generate` (it reads the schema, never connects).
env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
  JWT_SECRET: "ci-only-placeholder"

jobs:
  api:
    name: API — typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:shared

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Type-check
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Test
        run: pnpm --filter api test

  web:
    name: Web — typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:shared

      # apps/web/tsconfig.json includes .next/types/**/*.ts (routes.d.ts declares the global
      # LayoutProps/PageProps types every layout/page signature uses) — that directory is
      # gitignored and only ever written by `next dev`/`next build`, so a bare tsc run against a
      # fresh checkout fails with "Cannot find name 'LayoutProps'". `next typegen` generates just
      # that directory without a full build.
      - name: Generate Next.js route types
        run: pnpm --filter web exec next typegen

      - name: Type-check
        run: pnpm --filter web exec tsc --noEmit -p tsconfig.json

      # Non-blocking: the codebase currently has ~40 pre-existing lint errors (mostly
      # react-hooks/set-state-in-effect) that predate this workflow. Surfacing lint output here
      # without failing the build lets it show up in review without gating merges on a backlog
      # unrelated to any given PR — flip continue-on-error off once that backlog is cleared.
      - name: Lint
        run: pnpm --filter web lint
        continue-on-error: true

  e2e:
    name: E2E — critical path smoke test
    runs-on: ubuntu-latest
    # Unlike the two jobs above (mocked Prisma, no real connection needed), this one drives the
    # actual app over HTTP end to end — it needs a real Postgres to seed and a real Redis for the
    # API's BullMQ queues (REDIS_URL is a hard getOrThrow at boot, see queue.module.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baugeld
          POSTGRES_PASSWORD: baugeld
          POSTGRES_DB: baugeld
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baugeld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://baugeld:baugeld@localhost:5432/baugeld?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-only-placeholder"
      PORTAL_JWT_SECRET: "ci-only-placeholder-2"
      SUBCONTRACTOR_PORTAL_JWT_SECRET: "ci-only-placeholder-3"
      SUPPLIER_PORTAL_JWT_SECRET: "ci-only-placeholder-4"
      # Read via getOrThrow at request time, not at boot, and this suite never exercises Stripe
      # checkout or web push — placeholders satisfy the throw without ever reaching a real API.
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      # The Connect endpoint's secret — sepa-autopay.spec.ts signs its events with it.
      STRIPE_CONNECT_WEBHOOK_SECRET: "whsec_ci_connect_placeholder"
      # PushService validates the key pair's shape at boot (web-push rejects a public key that
      # doesn't decode to 65 bytes) even though nothing in this suite sends a real push — so unlike
      # the other placeholders above, this has to be a genuine (if otherwise unused) VAPID pair.
      # Generated once with `npx web-push generate-vapid-keys`; never used for a real subscription.
      VAPID_PUBLIC_KEY: "BJSI7u8e2QGQES1F9wPlznCHXmZC1R3GP5BdSsClfDHEslxCEpx9ZYVnfvCvvOWF6sLu4KssKfufNibC5WUcdtY"
      VAPID_PRIVATE_KEY: "1Jk-Cbfep9lZhY6iBbAj0v8bjtkOFKbMF_tmRNvDRuA"
      VAPID_SUBJECT: "mailto:ci@example.com"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:shared

      - name: Migrate + seed database
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx ts-node prisma/seed.ts

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: apps/api
        run: |
          nohup pnpm start:dev > /tmp/api.log 2>&1 &
          disown

      - name: Start web
        working-directory: apps/web
        run: |
          nohup pnpm dev > /tmp/web.log 2>&1 &
          disown

      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health > /dev/null && api_up=1 || api_up=0
            curl -sf http://localhost:3000 > /dev/null && web_up=1 || web_up=0
            if [ "$api_up" = "1" ] && [ "$web_up" = "1" ]; then exit 0; fi
            sleep 2
          done
          echo "--- api.log ---"; cat /tmp/api.log
          echo "--- web.log ---"; cat /tmp/web.log
          echo "Servers did not become ready in time" >&2
          exit 1

      - name: Run E2E suite
        working-directory: apps/e2e
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14

  docker:
    name: Docker — production stack rehearsal
    # Builds both production images and runs the whole production stack from them — the same
    # docker-compose.prod.yml, with production settings — swapping only what needs a real server
    # (docker-compose.local.yml: local TLS on *.localhost, SeaweedFS for S3, Mailpit for SMTP). Then
    # it checks what a deploy depends on: migrations on an empty database, TLS and security
    # headers, refusal of an unsafe setting, the E2E suite through Caddy, email delivery, uploads
    # landing in the bucket, and an encrypted backup that restores somewhere else.
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: cantero
      COMPOSE_FILE: docker-compose.prod.yml:docker-compose.local.yml
      E2E_WEB_URL: https://app.localhost:8443
      E2E_API_URL: https://api.localhost:8443/api
      BACKUP_S3_ENDPOINT: http://127.0.0.1:49000
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Tagged <project>-<service>, the names Compose gives the images it would build itself, so
      # `up --no-build` below runs exactly these.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: cantero-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # The ONNX runtime behind meaning-based search is the native module a Node upgrade breaks,
      # and semantic search is off in the rehearsal — so load it here directly.
      - name: Check the API image
        run: |
          docker run --rm --entrypoint node cantero-api:latest -e "
            if (!process.version.startsWith('v22.')) throw new Error('expected Node 22, got ' + process.version);
            import('@huggingface/transformers').then(() => console.log('Node', process.version, '— transformers and ONNX runtime load'));
          "

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: cantero-web:latest
          build-args: NEXT_PUBLIC_API_URL=https://api.localhost:8443/api
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:shared

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age libnss3-tools
          # Chromium resolves *.localhost itself; Node and the AWS CLI go through the resolver.
          echo "127.0.0.1 app.localhost api.localhost" | sudo tee -a /etc/hosts

      - name: Write the stack's settings
        run: scripts/local-prod-env.sh

      - name: Start the stack
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 90); do
            if curl -sfk -o /dev/null https://api.localhost:8443/api/health && curl -sfk -o /dev/null https://app.localhost:8443/login; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "The stack didn't come up" >&2
          exit 1

      - name: Trust Caddy's local certificate authority
        run: |
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/caddy-root.crt
          echo "NODE_EXTRA_CA_CERTS=/tmp/caddy-root.crt" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n caddy-local -i /tmp/caddy-root.crt

      - name: Check TLS, security headers and migrations
        run: |
          curl -sS --fail --cacert /tmp/caddy-root.crt -D /tmp/api.headers -o /dev/null https://api.localhost:8443/api/health
          curl -sS --fail --cacert /tmp/caddy-root.crt -D /tmp/web.headers -o /dev/null https://app.localhost:8443/login
          grep -qi '^strict-transport-security:' /tmp/api.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/api.headers
          grep -qi "^content-security-policy: default-src 'none'" /tmp/api.headers
          grep -qi '^permissions-policy: .*geolocation=(self)' /tmp/web.headers
          if grep -qi '^x-powered-by' /tmp/api.headers /tmp/web.headers; then echo "x-powered-by is still sent" >&2; exit 1; fi
          migrations=$(find apps/api/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)
          applied=$(docker compose exec -T postgres sh -c 'psql -At -U "$POSTGRES_USER" "$POSTGRES_DB" -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL"')
          echo "migrations: $migrations in the repo, $applied applied"
          test "$migrations" -eq "$applied"

      - name: Refuse to start with an unsafe setting
        run: |
          if docker compose run --rm --no-deps -e JWT_SECRET=too-short api > /tmp/refusal.log 2>&1; then
            cat /tmp/refusal.log; echo "The API started with a short JWT_SECRET" >&2; exit 1
          fi
          grep -q "JWT_SECRET is too short" /tmp/refusal.log

      - name: Load the demo data
        working-directory: apps/api
        run: |
          set -a; . ../../.env; set +a
          url="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:45432/$POSTGRES_DB"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          npx prisma generate
          DATABASE_URL="$url" npx ts-node prisma/seed.ts

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium

      # Everything except SSO (its test identity provider runs inside the test process, out of the
      # API container's reach) and semantic search (off here: the model isn't downloaded).
      - name: Run E2E through Caddy
        working-directory: apps/e2e
        run: |
          # The webhook secrets the specs sign Stripe events with — not the whole of .env.prod,
          # whose DATABASE_URL is the address inside the Docker network.
          setting() { grep "^$1=" ../../.env.prod | cut -d= -f2-; }
          export E2E_STRIPE_WEBHOOK_SECRET="$(setting STRIPE_WEBHOOK_SECRET)"
          export E2E_STRIPE_CONNECT_WEBHOOK_SECRET="$(setting STRIPE_CONNECT_WEBHOOK_SECRET)"
          npx playwright test $(ls tests/*.spec.ts | grep -v -e sso-saml -e semantic-search)

      - name: Check email went out through SMTP
        run: curl -sf http://127.0.0.1:48025/api/v1/messages | jq -e '.total > 0'

      - name: Check uploads landed in the bucket
        run: |
          set -a; . ./.env; set +a
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            aws s3 ls s3://cantero-uploads --recursive --endpoint-url "$BACKUP_S3_ENDPOINT" | grep -q .

      - name: Back up, then restore the backup elsewhere
        run: |
          age-keygen -o /tmp/backup.key 2>/dev/null
          BACKUP_AGE_RECIPIENT=$(age-keygen -y /tmp/backup.key) scripts/backup-db.sh
          scripts/verify-backup.sh /tmp/backup.key > /tmp/restored.txt
          for table in $(cut -d' ' -f1 /tmp/restored.txt); do
            echo "$table $(docker compose exec -T postgres sh -c "psql -At -U \"\$POSTGRES_USER\" \"\$POSTGRES_DB\" -c 'SELECT count(*) FROM \"$table\"'")"
          done > /tmp/live.txt
          diff /tmp/live.txt /tmp/restored.txt
          awk '$2 > 0' /tmp/restored.txt | grep -q '^invoices '

      - name: Show the stack's logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14
