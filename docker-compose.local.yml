# Local-only override — publishes ports on this Mac so you can hit the stack directly in a
# browser without Caddy/real domains. The prod file itself is untouched.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
#
# Web:  http://localhost:3001
# API:  http://localhost:4001/api

services:
  web:
    ports:
      - "3001:3000"
  api:
    ports:
      - "4001:4000"
    environment:
      # Reached directly on 4001 here, not through Caddy — no proxy hop to trust.
      TRUST_PROXY_HOPS: "0"
      # No S3 bucket locally: keep uploads on a named volume so they survive a rebuild (production
      # refuses local-disk uploads unless UPLOADS_DIR is set explicitly like this).
      UPLOADS_DIR: /app/uploads
    volumes:
      - api_uploads:/app/uploads
  postgres:
    ports:
      - "5433:5432"
  redis:
    ports:
      - "6380:6379"
  caddy:
    ports: []

volumes:
  api_uploads:
