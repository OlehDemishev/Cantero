# The production stack on this machine, for a rehearsal before a real deploy (and CI's "Docker"
# job). Everything in docker-compose.prod.yml runs unchanged, with production settings; only what
# needs a real server is swapped out:
#
#   - Caddy serves https://app.localhost:8443 and https://api.localhost:8443 with certificates from
#     its own local CA instead of Let's Encrypt (Caddyfile.local). Browsers resolve *.localhost to
#     this machine by themselves.
#   - SeaweedFS stands in for the S3 buckets (uploads and backups), Mailpit for the SMTP server —
#     every email the app sends shows up at http://127.0.0.1:48025.
#   - Postgres (45432) and the S3 service (49000) are published on loopback only, for the demo
#     seed and scripts/backup-db.sh. Ports are chosen not to clash with a local development database.
#
#   scripts/local-prod-env.sh          # writes .env and .env.prod with fresh secrets, once
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml down -v   # and wipe it

services:
  postgres:
    ports: ["127.0.0.1:45432:5432"]

  api:
    depends_on:
      s3-init:
        condition: service_completed_successfully

  caddy:
    ports: !override
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes: !override
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # SeaweedFS as the S3 service — a real object store, speaking the S3 API on 8333. It runs
  # without access keys here, so any key the app and the scripts present is accepted.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-volume.max=5"]
    ports: ["127.0.0.1:49000:8333"]
    volumes: [s3_data:/data]
    networks: [internal]

  # Creates the two buckets production would already have, then exits.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: eu-central-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0; until aws --endpoint-url http://s3:8333 s3 ls >/dev/null 2>&1 || [ $$i -ge 60 ]; do i=$$((i + 1)); sleep 1; done
        aws --endpoint-url http://s3:8333 s3 mb s3://cantero-uploads && aws --endpoint-url http://s3:8333 s3 mb s3://cantero-backups
    networks: [internal]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:48025:8025"]
    networks: [internal]

volumes:
  s3_data:
