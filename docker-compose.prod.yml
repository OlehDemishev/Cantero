# Production stack — one VPS, Docker Compose, Caddy for automatic HTTPS.
#
# Only `caddy` publishes host ports; postgres/redis/api/worker/web are reachable only from other
# containers on the `internal` network, addressed by service name. `api` serves HTTP and puts jobs
# on the queues; `worker` (same image) runs them.
#
# Two separate env files, on purpose:
#   .env       — plain vars Compose substitutes into THIS YAML file (e.g. the web build arg).
#   .env.prod  — runtime secrets injected into the `api` container via `env_file:`.
# Never put real secrets in `.env` — Compose reads it for YAML substitution, not container env.
#
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # Caddy is the one reverse proxy in front of the API — without this every client would share
      # Caddy's IP and so one login rate-limit bucket. `environment` wins over env_file, so a
      # TRUST_PROXY_HOPS copied into .env.prod from the local-dev example can't undo it.
      TRUST_PROXY_HOPS: "1"
      # HTTP only: jobs go on the queues and the `worker` service below runs them.
      PROCESS_ROLE: api
    # No model volume: the API has the worker compute its search vectors (see Embedder).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  # The background half: the same image running dist/src/worker — every queue processor (drawing
  # OCR, the search index, reminders, digests, recurring invoices, webhook delivery), no HTTP. It
  # waits for the api to be healthy, which means migrations have run (docker-entrypoint.sh), and
  # skips that entrypoint itself so the two never migrate at once.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    entrypoint: ["node"]
    command: ["dist/src/worker"]
    env_file:
      - .env.prod
    environment:
      # Serves no HTTP, so no proxy sits in front of it — the startup check wants it said.
      TRUST_PROXY_HOPS: "0"
    volumes:
      # The meaning-based search model (EMBEDDINGS_CACHE_DIR, ~0.5 GB download, ~1.7 GB in memory):
      # only the worker loads it — it builds the index and embeds the API's search queries. Kept
      # across redeploys instead of being downloaded again by every new container.
      - api_models:/app/.models
    healthcheck:
      # No endpoint to ask: the worker rewrites this file every 30 s while its event loop runs.
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/cantero-worker-alive').mtimeMs < 90000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks: [internal]

networks:
  internal:

volumes:
  api_models:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
