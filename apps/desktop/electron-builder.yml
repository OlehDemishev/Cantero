appId: dev.cantero.desktop
productName: Cantero
directories:
  output: release
files:
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.business
  # No Apple Developer ID configured — electron-builder falls back to ad-hoc signing, which is
  # enough to launch and test locally, but Gatekeeper will still show an "unidentified developer"
  # warning for anyone else who downloads it (right-click → Open bypasses that once, per machine).
  # Real distribution needs a Developer ID Application certificate (CSC_LINK/CSC_KEY_PASSWORD) and
  # notarization (APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD or APPLE_API_KEY) — plus hardenedRuntime:
  # true and an entitlements plist once that's set up, neither of which this config has yet.

# GitHub Releases — safe now that the repo is public (a private repo would need a token embedded
# in every shipped copy of the app just so end users' installs could download release assets,
# which is a real credential-leak risk: anyone can extract a string from a distributed binary).
# `electron-builder --publish always` uploads the installers here (needs a GH_TOKEN env var with
# `repo` scope at publish time only — end users' running apps just read the already-published
# release over plain HTTPS, no token needed on their side).
publish:
  provider: github
  owner: OlehDemishev
  repo: Cantero
