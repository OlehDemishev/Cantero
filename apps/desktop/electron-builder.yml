appId: dev.cantero.desktop
productName: Cantero
directories:
  output: release
files:
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.business
  # No Apple Developer ID configured — electron-builder falls back to ad-hoc signing, which is
  # enough to launch and test locally, but Gatekeeper will still show an "unidentified developer"
  # warning for anyone else who downloads it (right-click → Open bypasses that once, per machine).
  # Real distribution needs a Developer ID Application certificate (CSC_LINK/CSC_KEY_PASSWORD) and
  # notarization (APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD or APPLE_API_KEY) — plus hardenedRuntime:
  # true and an entitlements plist once that's set up, neither of which this config has yet.

# No update feed configured yet (electron-updater in src/main.ts is wired up but has nothing to
# check against) — set this to a real provider (e.g. `github`, or `generic` with a `url`) once
# there's an actual place to publish releases, then electron-builder will also emit the
# latest.yml metadata electron-updater needs.
publish: null
